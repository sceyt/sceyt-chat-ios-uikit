name: iOS CI

on:
  push:
    # main, dev, and the release branches (v1.6.17-beta.9-call, ...)
    branches: [main, dev, 'v*']
  pull_request:
    branches: [main, dev]
  # Lets the workflow be started by hand from the Actions tab, on any branch.
  workflow_dispatch:

permissions:
  contents: read

# Cancel older runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The pull request checks diff HEAD against the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false

      # Upload/download code stays small enough to read: files ≤600 lines, functions
      # ≤60, nesting ≤5. Runs first: it takes a second and needs no build.
      - name: Transfer code size
        run: python3 -I scripts/check_code_size.py Sources/SceytChatUIKit/DataTransfer

      # Every transfer failure leaves a tagged log line: no untagged or empty messages, no
      # empty catch, no silent `try?` on a file change.
      - name: Transfer logs
        run: python3 -I scripts/check_transfer_logs.py Sources/SceytChatUIKit/DataTransfer

      - name: Test the pull request checks
        if: github.event_name == 'pull_request'
        run: python3 -B -m unittest discover -s scripts/tests

      # Changed Swift and Objective-C files follow .editorconfig: UTF-8, LF, spaces, final newline.
      - name: Check changed source formatting
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/pr_checks.py format "$BASE_SHA"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # Simulator names change with every Xcode release, so pick whichever
      # iPhone the runner image has instead of hard-coding one.
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(python3 -I scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # What Swift 6 will make errors: the transfer layer stays free of data-race warnings.
      - name: Transfer strict concurrency
        run: scripts/check_strict_concurrency.sh "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"

      # Unit tests of the SceytChatUIKit Swift package. The demo-app UI tests
      # are not run here: the demo project depends on ../sceyt-call-ios-uikit,
      # which is not part of this repository.
      # The DB performance tests (500K/1M-message stores) are skipped — they
      # take most of the suite's time and only make sense on a quiet machine.
      # Complete concurrency checking is set here, not in Package.swift, so apps
      # that build the package do not get its warnings. The pull request warning
      # check then reports concurrency warnings on changed lines.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SceytChatUIKit \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:SceytChatUIKitTests/GlobalSearchMessagesViewModelDBPerformanceTests \
            -clonedSourcePackagesDirPath SourcePackages \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO SWIFT_STRICT_CONCURRENCY=complete 2>&1 | tee build.log

      - name: Check compiler warnings on changed lines
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/pr_checks.py warnings "$BASE_SHA" build.log

      # At least 80% of the added or modified executable lines in Sources/SceytChatUIKit.
      - name: Check changed source line coverage
        if: github.event_name == 'pull_request'
        run: python3 -B scripts/pr_checks.py coverage "$BASE_SHA" TestResults.xcresult

      # Compares the module's public Swift interface with api/SceytChatUIKit.swiftinterface.
      - name: Check the public API
        run: scripts/check_public_api.sh -clonedSourcePackagesDirPath SourcePackages

      # Surface what broke as annotations and a run summary, so a failure can be
      # read on the run page without downloading logs or artifacts.
      - name: Report failures
        if: failure()
        run: |
          {
            echo "## iOS CI failed"
            echo "$(xcodebuild -version | head -1), simulator ${{ steps.sim.outputs.udid }}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Compile errors
          grep -E '^/.+:[0-9]+:[0-9]+: error: ' build.log | sort -u | head -50 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s|^$GITHUB_WORKSPACE/||")
            lineno=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | cut -d: -f5- | sed 's/^ *//')
            echo "::error file=$file,line=$lineno::$msg"
            echo "- \`$file:$lineno\` $msg" >> "$GITHUB_STEP_SUMMARY"
          done

          # Failing tests
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact > summary.json || exit 0
            python3 - <<'EOF'
          import json, os
          d = json.load(open("summary.json"))
          lines = [f"**{d.get('result')}**: {d.get('passedTests')} passed, "
                   f"{d.get('failedTests')} failed, {d.get('skippedTests')} skipped"]
          log = open("build.log", errors="replace").read().splitlines()
          for f in d.get("testFailures", []):
              name, text = f.get("testIdentifierString"), f.get("failureText", "").replace("\n", " ")
              print(f"::error title={name}::{text}")
              lines.append(f"- `{name}`: {text}")
              # The failing test's own console output (last 80 lines), so it can be read
              # without access to the raw job log.
              cls, _, method = name.rstrip("()").partition("/")
              start = f"Test Case '-[SceytChatUIKitTests.{cls} {method}]' started"
              end = f"Test Case '-[SceytChatUIKitTests.{cls} {method}]' failed"
              s = next((i for i, l in enumerate(log) if l.startswith(start)), None)
              if s is not None:
                  e = next((i for i in range(s, len(log)) if log[i].startswith(end)), len(log) - 1)
                  excerpt = "%0A".join(l.replace("%", "%25") for l in log[s:e + 1][-80:])
                  print(f"::notice title=log {name}::{excerpt}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("\n".join(lines) + "\n")
          EOF
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            build.log
            build/api/SceytChatUIKit.swiftinterface
            build/api/build.log

  thread-sanitizer:
    name: Thread Sanitizer
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(python3 -I scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # A data race stops the test process and fails the test that was running.
      # The script skips the tests in its KNOWN_RACES list.
      - name: Run unit tests with Thread Sanitizer
        env:
          TEST_DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          scripts/run_thread_sanitizer_tests.sh \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath ThreadSanitizer.xcresult 2>&1 | tee thread-sanitizer.log

      - name: Upload Thread Sanitizer results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thread-sanitizer-results
          path: |
            ThreadSanitizer.xcresult
            thread-sanitizer.log

  slack-alerts:
    name: Slack Alerts
    needs: [unit-tests, thread-sanitizer]
    if: always() && !cancelled() && !contains(needs.*.result, 'cancelled') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/channel-alerts.yml
    with:
      failed: ${{ contains(needs.*.result, 'failure') }}
    secrets:
      SLACK_WEBHOOK_URL_CI_IOS: ${{ secrets.SLACK_WEBHOOK_URL_CI_IOS }}
