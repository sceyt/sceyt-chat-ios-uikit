name: iOS CI

on:
  push:
    # main, dev, and the release branches (v1.6.17-beta.9-call, ...)
    branches: [main, dev, 'v*']
  pull_request:
    branches: [main, dev]
  # Lets the workflow be started by hand from the Actions tab, on any branch.
  workflow_dispatch:

# Cancel older runs on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # Simulator names change with every Xcode release, so pick whichever
      # iPhone the runner image has instead of hard-coding one.
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if "iOS" in r), reverse=True)
          for r in ios:
              for d in runtimes[r]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          sys.exit("no iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Unit tests of the SceytChatUIKit Swift package. The demo-app UI tests
      # are not run here: the demo project depends on ../sceyt-call-ios-uikit,
      # which is not part of this repository.
      # The DB performance tests (500K/1M-message stores) are skipped — they
      # take most of the suite's time and only make sense on a quiet machine.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SceytChatUIKit \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:SceytChatUIKitTests/GlobalSearchMessagesViewModelDBPerformanceTests \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      # Surface what broke as annotations and a run summary, so a failure can be
      # read on the run page without downloading logs or artifacts.
      - name: Report failures
        if: failure()
        run: |
          {
            echo "## iOS CI failed"
            echo "$(xcodebuild -version | head -1), simulator ${{ steps.sim.outputs.udid }}"
          } >> "$GITHUB_STEP_SUMMARY"

          # Compile errors
          grep -E '^/.+:[0-9]+:[0-9]+: error: ' build.log | sort -u | head -50 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s|^$GITHUB_WORKSPACE/||")
            lineno=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | cut -d: -f5- | sed 's/^ *//')
            echo "::error file=$file,line=$lineno::$msg"
            echo "- \`$file:$lineno\` $msg" >> "$GITHUB_STEP_SUMMARY"
          done

          # Failing tests
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact > summary.json || exit 0
            python3 - <<'EOF'
          import json, os
          d = json.load(open("summary.json"))
          lines = [f"**{d.get('result')}**: {d.get('passedTests')} passed, "
                   f"{d.get('failedTests')} failed, {d.get('skippedTests')} skipped"]
          log = open("build.log", errors="replace").read().splitlines()
          for f in d.get("testFailures", []):
              name, text = f.get("testIdentifierString"), f.get("failureText", "").replace("\n", " ")
              print(f"::error title={name}::{text}")
              lines.append(f"- `{name}`: {text}")
              # The failing test's own console output (last 80 lines), so it can be read
              # without access to the raw job log.
              cls, _, method = name.rstrip("()").partition("/")
              start = f"Test Case '-[SceytChatUIKitTests.{cls} {method}]' started"
              end = f"Test Case '-[SceytChatUIKitTests.{cls} {method}]' failed"
              s = next((i for i, l in enumerate(log) if l.startswith(start)), None)
              if s is not None:
                  e = next((i for i in range(s, len(log)) if log[i].startswith(end)), len(log) - 1)
                  excerpt = "%0A".join(l.replace("%", "%25") for l in log[s:e + 1][-80:])
                  print(f"::notice title=log {name}::{excerpt}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("\n".join(lines) + "\n")
          EOF
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            build.log
